name: Temporary Kafka integration test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kafka-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kafka client dependency
        run: python -m pip install --upgrade pip confluent-kafka

      - name: Start temporary Apache Kafka 4.4.0
        run: |
          docker run -d --name kafka \
            -p 9092:9092 -p 9093:9093 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            apache/kafka:4.4.0

      - name: Wait for Kafka to become ready
        run: |
          for attempt in $(seq 1 60); do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs kafka
          echo "Kafka did not become ready in time."
          exit 1

      - name: Test this repository's Kafka producer and consumer
        run: |
          python - <<'PY'
          from kafka.client import (
              DeliveryTracker,
              create_producer,
              consume_events,
              ensure_topics,
              flush_producer,
              publish_event,
          )
          from kafka.settings import KafkaSettings

          settings = KafkaSettings(
              bootstrap_servers="localhost:9092",
              events_topic="gha-smoke-events",
              dead_letter_topic="gha-smoke-dlq",
              consumer_group="gha-smoke-consumer",
              partitions=1,
              replication_factor=1,
          )

          ensure_topics(settings)

          producer = create_producer(settings)
          tracker = DeliveryTracker()
          publish_event(
              producer,
              {
                  "event_id": "gha-kafka-smoke-test",
                  "player_id": "test-player-001",
                  "event_type": "match_start",
                  "score": 0,
              },
              settings,
              tracker,
          )
          flush_producer(producer, tracker)

          processed, dead_lettered = consume_events(
              settings,
              processor=lambda event: (
                  True if event.get("event_id") == "gha-kafka-smoke-test" else False
              ),
              max_messages=1,
              group_id="gha-smoke-test-run",
          )

          assert processed == 1, f"Expected 1 processed event, got {processed}"
          assert dead_lettered == 0, f"Expected 0 DLQ events, got {dead_lettered}"
          print("PASS: repository Kafka producer -> broker -> consumer.")
          PY

      - name: Show Kafka logs and clean up
        if: always()
        run: |
          docker logs kafka 2>&1 | tail -n 100 || true
          docker rm -f kafka || true
